name: Synthetic comparison browser

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Build and test the bundled synthetic fixture
        run: |
          python3 -m unittest -v
          python3 compare_fixture.py
      - name: Prepare the pinned browser test runner
        working-directory: tests/browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/playwright install --with-deps --only-shell chromium
      - name: Verify the offline comparison in Chromium
        working-directory: tests/browser
        run: npm test
